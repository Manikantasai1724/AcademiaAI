# ==============================================================================
# Render Blueprint Specification for AcademiaAI
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Backend API Service (FastAPI + PyTorch + FAISS)
  # ----------------------------------------------------------------------------
  - type: web
    name: academiaai-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter # 2 GB RAM recommended for PyTorch & SentenceTransformers
    region: oregon
    healthCheckPath: /health
    disk:
      name: academiaai-data
      mountPath: /app/data
      sizeGB: 5
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "8000"
      - key: GEMINI_API_KEY
        sync: false # Set securely in the Render Dashboard
      - key: GEMINI_MODEL_NAME
        value: gemini-3.8-flash
      - key: GROQ_API_KEY
        sync: false # Optional secondary fallback
      - key: EMBEDDING_MODEL_NAME
        value: BAAI/bge-base-en-v1.5

  # ----------------------------------------------------------------------------
  # Frontend Static Site (React + Vite + Tailwind CSS)
  # ----------------------------------------------------------------------------
  - type: web
    name: academiaai-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: academiaai-backend
          property: host
        transform: https://$VALUE/api
